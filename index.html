<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP 环境分析</title>

<style>

:root{
 --bg:#f5f7fb;
 --card:#fff;
 --border:#e5e7eb;
 --text:#111827;
 --sub:#6b7280;
 --green:#059669;
 --green-bg:#eefbf5;
 --red:#dc2626;
 --red-bg:#fef2f2;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:var(--bg);
 font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
 color:var(--text);
}

.container{
 max-width:1000px;
 margin:auto;
 padding:30px 20px;
}

.card{
 background:white;
 border:1px solid var(--border);
 border-radius:20px;
}

.hero{
 padding:30px;
 margin-bottom:20px;
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:20px;
}

.ip-label{
 color:var(--sub);
 font-size:14px;
}

.ip{
 font-size:40px;
 font-weight:800;
 margin-top:8px;
}

.location{
 margin-top:10px;
 color:var(--sub);
}

.risk{
 text-align:right;
 min-width:120px;
}

.risk-circle{
 width:80px;
 height:80px;
 border-radius:50%;
 background:var(--green-bg);
 color:var(--green);
 border:2px solid #a7f3d0;

 display:flex;
 align-items:center;
 justify-content:center;
 margin-left:auto;

 font-weight:700;
 font-size:22px;
}

.score{
 margin-top:10px;
}

.progress{
 margin-top:10px;
 width:150px;
 height:10px;
 background:#e5e7eb;
 border-radius:999px;
 overflow:hidden;
}

.progress-bar{
 height:100%;
 width:0;
 background:#22c55e;
}

.type-card{
 padding:24px;
 display:flex;
 align-items:center;
 gap:20px;
 margin-bottom:20px;
}

.icon{
 width:60px;
 height:60px;
 border-radius:16px;
 background:var(--green-bg);
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:28px;
}

.type-title{
 font-size:24px;
 font-weight:700;
}

.badge{
 display:inline-block;
 padding:4px 10px;
 background:#ecfdf5;
 color:var(--green);
 border-radius:999px;
 font-size:12px;
 margin-left:8px;
}

.desc{
 color:var(--sub);
 margin-top:6px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:16px;
}

.info{
 background:white;
 border:1px solid var(--border);
 border-radius:16px;
 padding:20px;
}

.label{
 color:var(--sub);
 font-size:13px;
 margin-bottom:6px;
}

.value{
 font-size:20px;
 font-weight:700;
}

.safe-box{
 margin-top:20px;
 background:var(--green-bg);
 border:1px solid #a7f3d0;
 border-radius:18px;
 padding:24px;
}

.safe-title{
 color:var(--green);
 font-size:20px;
 font-weight:700;
}

.safe-desc{
 margin-top:8px;
 color:#065f46;
}

.loading{
 text-align:center;
 padding:100px 0;
 color:#64748b;
 font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<div id="loading" class="loading">
正在检测网络环境...
</div>

<div id="app" style="display:none">

<div class="card hero">

<div>
<div class="ip-label">IP 地址</div>
<div id="ip" class="ip">-</div>
<div id="location" class="location">-</div>
</div>

<div class="risk">

<div id="status" class="risk-circle">
安全
</div>

<div id="score" class="score">
0/100
</div>

<div class="progress">
<div id="progress" class="progress-bar"></div>
</div>

</div>

</div>

<div class="card type-card">

<div class="icon" id="icon">🏠</div>

<div>

<div>
<span id="type" class="type-title">
家庭宽带
</span>

<span class="badge">
低风险
</span>
</div>

<div id="typeDesc" class="desc">
住宅网络环境
</div>

</div>

</div>

<div class="grid" id="grid"></div>

<div class="safe-box">

<div id="safeTitle" class="safe-title">
✅ 未检测到明显风险
</div>

<div id="safeDesc" class="safe-desc">
当前网络环境正常
</div>

</div>

</div>

</div>

<script>

function info(label,value){

return `
<div class="info">
<div class="label">${label}</div>
<div class="value">${value ?? '-'}</div>
</div>
`;

}

load();

async function load(){

try{

const data =
await fetch('/api/ip')
.then(r=>r.json());

let score = 0;

if(data.is_datacenter) score += 50;
if(data.is_vpn) score += 20;
if(data.is_proxy) score += 20;
if(data.is_tor) score += 30;
if(data.is_abuser) score += 30;

let type = "家庭宽带";
let icon = "🏠";
let desc = "常规 ISP 网络";

if(data.is_datacenter){
    type = "数据中心";
    icon = "🖥️";
    desc = "云服务商或机房网络";
}

if(data.is_vpn){
    type = "VPN 网络";
    icon = "🔒";
    desc = "检测到 VPN";
}

if(data.is_proxy){
    type = "代理网络";
    icon = "🌐";
    desc = "检测到代理服务";
}

document.getElementById('ip').textContent =
data.ip;

document.getElementById('location').textContent =
`${data.city || '-'} · ${data.country || '-'}`;

document.getElementById('score').textContent =
`${score}/100`;

document.getElementById('progress').style.width =
`${score}%`;

document.getElementById('type').textContent =
type;

document.getElementById('icon').textContent =
icon;

document.getElementById('typeDesc').textContent =
desc;

document.getElementById('grid').innerHTML =

info('国家', data.country) +
info('城市', data.city) +
info('ASN', data.asn ? 'AS'+data.asn : '-') +
info('运营商', data.company?.name || '-') +
info('时区', data.timezone) +
info('纬度', data.location?.latitude || '-') +
info('经度', data.location?.longitude || '-') +
info('VPN', data.is_vpn ? '是' : '否') +
info('代理', data.is_proxy ? '是' : '否') +
info('Tor', data.is_tor ? '是' : '否') +
info('数据中心', data.is_datacenter ? '是' : '否');

if(score > 0){

document.getElementById('status').textContent =
'警告';

document.getElementById('safeTitle').textContent =
'⚠️ 检测到潜在风险';

document.getElementById('safeDesc').textContent =
'该 IP 存在代理、VPN、Tor 或机房特征。';

}

document.getElementById('loading').style.display='none';
document.getElementById('app').style.display='block';

}catch(e){

document.getElementById('loading').innerHTML =
'获取失败：' + e.message;

}

}

</script>

</body>
</html>
