<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 查询示例</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 30px;
}

.card {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h2 {
    margin-top: 0;
}

.item {
    margin: 12px 0;
    padding: 10px;
    background: #f8f9fb;
    border-radius: 6px;
}

.label {
    font-weight: bold;
    color: #555;
}

.loading {
    color: #999;
}
</style>
</head>

<body>

<div class="card">
    <h2>🌍 IP 信息查询</h2>

    <div id="result" class="loading">
        正在获取信息...
    </div>
</div>

<script>
async function loadIPInfo() {
    const result = document.getElementById("result");

    try {
        const response = await fetch("https://ip.fs.kg/json");
        const data = await response.json();

        result.innerHTML = `
            <div class="item">
                <span class="label">IP 地址：</span>${data.ip || "-"}
            </div>

            <div class="item">
                <span class="label">国家：</span>${data.country || "-"}
            </div>

            <div class="item">
                <span class="label">城市：</span>${data.city || "-"}
            </div>

            <div class="item">
                <span class="label">运营商：</span>${data.org || "-"}
            </div>

            <div class="item">
                <span class="label">ASN：</span>${data.asn || "-"}
            </div>

            <div class="item">
                <span class="label">时区：</span>${data.timezone || "-"}
            </div>

            <div class="item">
                <span class="label">纬度：</span>${data.latitude || "-"}
            </div>

            <div class="item">
                <span class="label">经度：</span>${data.longitude || "-"}
            </div>
        `;
    } catch (err) {
        result.innerHTML =
            '<span style="color:red;">获取失败：' + err.message + '</span>';
    }
}

loadIPInfo();
</script>

</body>
</html>
