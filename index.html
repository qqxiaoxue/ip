<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 环境分析</title>

<style>

:root{
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --sub:#6b7280;
    --green:#16a34a;
    --green-bg:#ecfdf5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    line-height:1.5;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

/* 顶部 */

.hero{
    background:white;
    border:1px solid var(--border);
    border-radius:24px;
    padding:48px;
    margin-bottom:24px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 14px;

    border-radius:999px;

    background:var(--green-bg);
    color:var(--green);

    font-size:14px;
    font-weight:600;

    margin-bottom:24px;
}

.title{
    color:var(--sub);
    font-size:14px;
    margin-bottom:8px;
}

.ip{
    font-size:56px;
    font-weight:800;
    letter-spacing:-2px;
    line-height:1.1;
}

.location{
    margin-top:12px;
    color:var(--sub);
    font-size:18px;
}

.actions{
    margin-top:28px;
}

.btn{
    border:none;
    cursor:pointer;

    background:#111827;
    color:white;

    padding:12px 20px;
    border-radius:12px;

    font-size:14px;
    font-weight:600;
}

.btn:hover{
    opacity:.92;
}

/* 信息区 */

.section-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:16px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));

    gap:16px;

    margin-bottom:28px;
}

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:20px;

    padding:24px;
}

.label{
    color:var(--sub);
    font-size:13px;
    margin-bottom:10px;
}

.value{
    font-size:28px;
    font-weight:700;
}

.small{
    font-size:18px;
}

.status-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
}

.status{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
}

.status-head{
    color:var(--sub);
    font-size:13px;
    margin-bottom:6px;
}

.status-value{
    font-size:18px;
    font-weight:600;
}

.success{
    color:var(--green);
}

.raw{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
    margin-top:24px;
}

pre{
    overflow:auto;
    white-space:pre-wrap;
    font-size:13px;
    color:#374151;
}

.loading{
    text-align:center;
    margin-top:120px;
    font-size:22px;
    color:var(--sub);
}

.error{
    color:#dc2626;
}

@media(max-width:768px){

    .hero{
        padding:28px;
    }

    .ip{
        font-size:34px;
        word-break:break-all;
    }

    .location{
        font-size:16px;
    }
}

</style>
</head>
<body>

<div class="container">

<div id="loading" class="loading">
    正在分析当前 IP 环境...
</div>

<div id="app" style="display:none;">

    <div class="hero">

        <div class="badge">
            ✅ 环境状态正常
        </div>

        <div class="title">
            当前公网 IP
        </div>

        <div id="ip" class="ip">
            -
        </div>

        <div id="location" class="location">
            -
        </div>

        <div class="actions">
            <button class="btn" onclick="copyIP()">
                复制 IP 地址
            </button>
        </div>

    </div>

    <h2 class="section-title">网络环境</h2>

    <div class="status-grid">

        <div class="status">
            <div class="status-head">IP 类型</div>
            <div class="status-value" id="type">-</div>
        </div>

        <div class="status">
            <div class="status-head">HTTPS</div>
            <div class="status-value success" id="httpsStatus">
                -
            </div>
        </div>

        <div class="status">
            <div class="status-head">TLS</div>
            <div class="status-value" id="tls">
                -
            </div>
        </div>

        <div class="status">
            <div class="status-head">边缘节点</div>
            <div class="status-value" id="colo">
                -
            </div>
        </div>

    </div>

    <br>

    <h2 class="section-title">详细信息</h2>

    <div id="cards" class="grid"></div>

    <div class="raw">

        <h2 class="section-title">
            原始数据
        </h2>

        <pre id="json"></pre>

    </div>

</div>

</div>

<script>

let currentIP = '';

function copyIP(){

    navigator.clipboard
        .writeText(currentIP)
        .then(() => {
            alert("IP 已复制");
        });

}

function card(title,value,small=false){

    return `
        <div class="card">
            <div class="label">${title}</div>
            <div class="value ${small ? 'small' : ''}">
                ${value || '-'}
            </div>
        </div>
    `;
}

async function load(){

    try{

        const res = await fetch(
            "https://ip.fs.kg/json"
        );

        const data = await res.json();

        currentIP = data.ip;

        document.getElementById("ip")
            .innerText = data.ip;

        document.getElementById("location")
            .innerText =
            `${data.city || '-'} · ${data.region || '-'} · ${data.country || '-'}`;

        document.getElementById("type")
            .innerText = data.type || "-";

        document.getElementById("tls")
            .innerText = data.tlsVersion || "-";

        document.getElementById("colo")
            .innerText = data.colo || "-";

        document.getElementById("httpsStatus")
            .innerText =
            data.httpProtocol === "HTTPS"
            ? "已启用"
            : "未启用";

        document.getElementById("cards")
        .innerHTML =

            card("ASN","AS"+data.asn) +

            card("国家",data.country) +

            card("国家代码",data.country_code) +

            card("地区",data.region) +

            card("城市",data.city) +

            card("时区",data.timezone,true) +

            card("语言",data.acceptLanguage,true) +

            card("纬度",data.latitude) +

            card("经度",data.longitude) +

            card("HTTP协议",data.httpProtocol) +

            card("TLS加密套件",
            data.tlsCipher,true);

        document.getElementById("json")
            .textContent =
            JSON.stringify(
                data,
                null,
                2
            );

        document.getElementById("loading")
            .style.display="none";

        document.getElementById("app")
            .style.display="block";

    }
    catch(err){

        document.getElementById("loading")
        .innerHTML = `
            <div class="error">
                获取失败：${err.message}
            </div>
        `;
    }
}

load();

</script>

</body>
</html>
