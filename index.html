<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 环境分析</title>

<style>
:root{
    --bg:#f8fafc;
    --card:#fff;
    --border:#e5e7eb;
    --text:#111827;
    --sub:#6b7280;
    --green:#16a34a;
    --green-bg:#ecfdf5;
    --yellow:#d97706;
    --yellow-bg:#fef3c7;
    --red:#dc2626;
    --red-bg:#fee2e2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:32px 20px;
}

.hero{
    background:#fff;
    border:1px solid var(--border);
    border-radius:24px;
    padding:32px;
    margin-bottom:20px;
}

.search{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.search input{
    flex:1;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:14px;
    font-size:15px;
}

.search button{
    border:none;
    background:#111827;
    color:#fff;
    padding:14px 22px;
    border-radius:14px;
    cursor:pointer;
}

.search button:hover{
    opacity:.92;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:8px 14px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
}

.safe{
    background:var(--green-bg);
    color:var(--green);
}

.warn{
    background:var(--yellow-bg);
    color:var(--yellow);
}

.danger{
    background:var(--red-bg);
    color:var(--red);
}

.ip-title{
    color:var(--sub);
    font-size:14px;
    margin-top:20px;
}

.ip{
    font-size:56px;
    font-weight:800;
    letter-spacing:-2px;
    word-break:break-all;
}

.location{
    margin-top:10px;
    color:var(--sub);
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
}

.label{
    color:var(--sub);
    font-size:13px;
    margin-bottom:8px;
}

.value{
    font-size:24px;
    font-weight:700;
}

.analysis{
    margin-top:20px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
}

.analysis h3{
    margin-bottom:12px;
}

.analysis p{
    line-height:1.8;
    color:#374151;
}

.loading{
    text-align:center;
    margin-top:120px;
    color:var(--sub);
    font-size:20px;
}

@media(max-width:768px){

    .ip{
        font-size:40px;
    }

    .search{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div class="container">

<div id="loading" class="loading">
正在分析网络环境...
</div>

<div id="app" style="display:none">

<div class="hero">

<div class="search">

<input
id="ipInput"
type="text"
placeholder="输入 IP 地址，例如 8.8.8.8">

<button onclick="queryIP()">
查询
</button>

</div>

<div id="riskBadge" class="badge safe">
✅ 低风险
</div>

<div class="ip-title">
当前 IP
</div>

<div id="ip" class="ip">
-
</div>

<div id="location" class="location">
-
</div>

</div>

<div class="grid">

<div class="card">
<div class="label">网络类型</div>
<div id="networkType" class="value">-</div>
</div>

<div class="card">
<div class="label">风险评分</div>
<div id="riskScore" class="value">-</div>
</div>

<div class="card">
<div class="label">ASN</div>
<div id="asn" class="value">-</div>
</div>

<div class="card">
<div class="label">TLS版本</div>
<div id="tls" class="value">-</div>
</div>

<div class="card">
<div class="label">边缘节点</div>
<div id="colo" class="value">-</div>
</div>

<div class="card">
<div class="label">协议</div>
<div id="protocol" class="value">-</div>
</div>

</div>

<div class="analysis">

<h3>环境分析</h3>

<p id="analysisText">
-
</p>

</div>

</div>

</div>

<script>

const countryMap = {
JP:"日本",
CN:"中国",
HK:"中国香港",
MO:"中国澳门",
TW:"中国台湾",
US:"美国",
SG:"新加坡",
KR:"韩国",
GB:"英国",
FR:"法国",
DE:"德国",
CA:"加拿大",
AU:"澳大利亚",
RU:"俄罗斯",
IN:"印度"
};

const cityMap = {

Tokyo:"东京",
Osaka:"大阪",
Kyoto:"京都",
Nagoya:"名古屋",
Yokohama:"横滨",
Kobe:"神户",
Sapporo:"札幌",
Fukuoka:"福冈",

Beijing:"北京",
Shanghai:"上海",
Guangzhou:"广州",
Shenzhen:"深圳",
Chengdu:"成都",
Hangzhou:"杭州",
Nanjing:"南京",
Wuhan:"武汉",
Tianjin:"天津",
Chongqing:"重庆",

"Hong Kong":"香港",

Taipei:"台北",
Taichung:"台中",
Kaohsiung:"高雄",

Singapore:"新加坡",

Seoul:"首尔",
Busan:"釜山",
Incheon:"仁川",

"New York":"纽约",
"Los Angeles":"洛杉矶",
Chicago:"芝加哥",
Seattle:"西雅图",
Boston:"波士顿",
Dallas:"达拉斯",
Houston:"休斯敦",
Miami:"迈阿密",
Atlanta:"亚特兰大",
Phoenix:"菲尼克斯",
Denver:"丹佛",
Austin:"奥斯汀",
"San Francisco":"旧金山",

London:"伦敦",
Manchester:"曼彻斯特",
Birmingham:"伯明翰",

Berlin:"柏林",
Frankfurt:"法兰克福",
Munich:"慕尼黑",

Paris:"巴黎",
Lyon:"里昂",

Toronto:"多伦多",
Vancouver:"温哥华",
Montreal:"蒙特利尔",

Sydney:"悉尼",
Melbourne:"墨尔本",
Brisbane:"布里斯班",
Perth:"珀斯",

Moscow:"莫斯科"
};

function calculateRisk(data){

    const text = `
        ${data.org || ''}
        ${data.isp || ''}
        ${data.asn || ''}
    `.toLowerCase();

    let score = 0;

    const reasons = [];

    const rules = [

        {keywords:['amazon','aws'],score:45,name:'Amazon AWS'},
        {keywords:['google'],score:45,name:'Google Cloud'},
        {keywords:['microsoft','azure'],score:45,name:'Microsoft Azure'},
        {keywords:['digitalocean'],score:45,name:'DigitalOcean'},
        {keywords:['linode'],score:45,name:'Linode'},
        {keywords:['vultr'],score:45,name:'Vultr'},
        {keywords:['ovh'],score:45,name:'OVH'},
        {keywords:['hetzner'],score:45,name:'Hetzner'},
        {keywords:['cloudflare'],score:35,name:'Cloudflare'}

    ];

    for(const rule of rules){

        if(rule.keywords.some(
            item => text.includes(item)
        )){
            score += rule.score;
            reasons.push(
                `命中规则：${rule.name}（+${rule.score}）`
            );
        }
    }

    score = Math.min(score,100);

    let level;
    let type;
    let badgeClass;

    if(score <= 19){

        type = "住宅/企业网络";
        level = "✅ 低风险";
        badgeClass = "safe";

    }else if(score <= 39){

        type = "骨干网络";
        level = "⚠️ 中风险";
        badgeClass = "warn";

    }else if(score <= 69){

        type = "云主机/托管服务器";
        level = "⚠️ 较高风险";
        badgeClass = "warn";

    }else{

        type = "代理/VPN高概率";
        level = "❌ 高风险";
        badgeClass = "danger";

    }

    if(reasons.length === 0){

        reasons.push(
            "未发现明显云服务商或托管网络特征，推测为普通互联网接入网络。"
        );
    }

    return {
        score,
        type,
        level,
        badgeClass,
        reasons
    };
}

async function load(targetIP=''){

    try{

        const url = targetIP
            ? `https://ip.fs.kg/${targetIP}/json`
            : 'https://ip.fs.kg/json';

        const data = await fetch(url)
            .then(r => r.json());

        const city =
            cityMap[data.city]
            || data.city
            || "未知城市";

        const region =
            cityMap[data.region]
            || data.region
            || "未知地区";

        const country =
            countryMap[data.country]
            || data.country
            || "未知国家";

        const risk = calculateRisk(data);

        document.getElementById('ip')
            .textContent =
            data.ip || '-';

        document.getElementById('location')
            .textContent =
            `${city} · ${region} · ${country}`;

        document.getElementById('asn')
            .textContent =
            data.asn
            ? `AS${data.asn}`
            : '-';

        document.getElementById('tls')
            .textContent =
            data.tlsVersion || '-';

        document.getElementById('colo')
            .textContent =
            data.colo || '-';

        document.getElementById('protocol')
            .textContent =
            data.httpProtocol || '-';

        document.getElementById('networkType')
            .textContent =
            risk.type;

        document.getElementById('riskScore')
            .textContent =
            risk.score;

        const badge =
            document.getElementById('riskBadge');

        badge.className =
            `badge ${risk.badgeClass}`;

        badge.textContent =
            risk.level;

        document.getElementById('analysisText')
            .innerHTML =
            risk.reasons.join('<br>');

        document.getElementById('loading')
            .style.display='none';

        document.getElementById('app')
            .style.display='block';

    }catch(error){

        document.getElementById('loading')
            .innerHTML =
            '查询失败：' + error.message;

    }
}

function queryIP(){

    const ip =
        document.getElementById(
            'ipInput'
        ).value.trim();

    load(ip);
}

document.addEventListener(
'DOMContentLoaded',
()=>{

    document
    .getElementById('ipInput')
    .addEventListener(
        'keydown',
        e=>{

            if(e.key==='Enter'){
                queryIP();
            }

        }
    );

    load();
});
</script>

</body>
</html>
