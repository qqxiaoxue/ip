<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 环境分析</title>

<style>
:root{
    --bg:#f8fafc;
    --card:#fff;
    --border:#e5e7eb;
    --text:#111827;
    --sub:#6b7280;
    --green:#16a34a;
    --green-bg:#ecfdf5;
    --yellow:#d97706;
    --yellow-bg:#fef3c7;
    --red:#dc2626;
    --red-bg:#fee2e2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:32px 20px;
}

.hero{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:32px;
    margin-bottom:20px;
}

.search{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.search input{
    flex:1;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:14px;
    font-size:15px;
}

.search button{
    border:none;
    background:#111827;
    color:white;
    padding:14px 22px;
    border-radius:14px;
    cursor:pointer;
}

.search button:hover{
    opacity:.9;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:8px 14px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
}

.safe{
    background:var(--green-bg);
    color:var(--green);
}

.warn{
    background:var(--yellow-bg);
    color:var(--yellow);
}

.danger{
    background:var(--red-bg);
    color:var(--red);
}

.ip-title{
    color:var(--sub);
    font-size:14px;
    margin-top:20px;
}

.ip{
    font-size:56px;
    font-weight:800;
    letter-spacing:-2px;
    word-break:break-all;
}

.location{
    margin-top:10px;
    color:var(--sub);
    font-size:18px;
}

.actions{
    margin-top:20px;
}

.copy-btn{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    background:#111827;
    color:#fff;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
}

.label{
    color:var(--sub);
    font-size:13px;
    margin-bottom:8px;
}

.value{
    font-size:24px;
    font-weight:700;
}

.analysis{
    margin-top:20px;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
}

.analysis h3{
    margin-bottom:15px;
}

.analysis p{
    line-height:1.8;
    color:#374151;
}

.loading{
    text-align:center;
    margin-top:120px;
    color:var(--sub);
    font-size:20px;
}
</style>
</head>
<body>

<div class="container">

<div id="loading" class="loading">
正在分析网络环境...
</div>

<div id="app" style="display:none">

<div class="hero">

<div class="search">

<input
id="ipInput"
type="text"
placeholder="输入 IP 地址，例如 8.8.8.8">

<button onclick="queryIP()">
查询
</button>

</div>

<div id="riskBadge" class="badge safe">
✅ 低风险
</div>

<div class="ip-title">
当前 IP
</div>

<div id="ip" class="ip">
-
</div>

<div id="location" class="location">
-
</div>

<div class="actions">
<button class="copy-btn" onclick="copyIP()">
复制 IP
</button>
</div>

</div>

<div class="grid">

<div class="card">
<div class="label">环境类型</div>
<div id="networkType" class="value">-</div>
</div>

<div class="card">
<div class="label">风险评分</div>
<div id="riskScore" class="value">-</div>
</div>

<div class="card">
<div class="label">ASN</div>
<div id="asn" class="value">-</div>
</div>

<div class="card">
<div class="label">TLS</div>
<div id="tls" class="value">-</div>
</div>

<div class="card">
<div class="label">节点</div>
<div id="colo" class="value">-</div>
</div>

<div class="card">
<div class="label">协议</div>
<div id="protocol" class="value">-</div>
</div>

</div>

<div class="analysis">

<h3>分析结果</h3>

<p id="analysisText">
-
</p>

</div>

</div>

</div>

<script>

let currentIP = '';

function copyIP(){

    if(!currentIP) return;

    navigator.clipboard
        .writeText(currentIP)
        .then(()=>{
            alert("IP已复制");
        });
}

function calculateRisk(data){

    const text = `
        ${data.org || ''}
        ${data.isp || ''}
        ${data.asn || ''}
    `.toLowerCase();

    let score = 0;

    const reasons = [];

    const rules = [

        {
            keywords:['amazon','aws'],
            score:45,
            reason:'Amazon AWS'
        },

        {
            keywords:['google'],
            score:45,
            reason:'Google Cloud'
        },

        {
            keywords:['azure','microsoft'],
            score:45,
            reason:'Microsoft Azure'
        },

        {
            keywords:['cloudflare'],
            score:35,
            reason:'Cloudflare'
        },

        {
            keywords:['digitalocean'],
            score:45,
            reason:'DigitalOcean'
        },

        {
            keywords:['linode'],
            score:45,
            reason:'Linode'
        },

        {
            keywords:['vultr'],
            score:45,
            reason:'Vultr'
        },

        {
            keywords:['ovh'],
            score:45,
            reason:'OVH'
        },

        {
            keywords:['hetzner'],
            score:45,
            reason:'Hetzner'
        }

    ];

    for(const rule of rules){

        if(rule.keywords.some(
            v => text.includes(v)
        )){
            score += rule.score;

            reasons.push(
                `${rule.reason} (+${rule.score})`
            );
        }
    }

    score = Math.min(score,100);

    let type;
    let level;
    let badgeClass;

    if(score <= 19){

        type = '住宅/企业网络';
        level = '✅ 低风险';
        badgeClass = 'safe';

    }else if(score <= 39){

        type = '机房或骨干出口';
        level = '⚠️ 中风险';
        badgeClass = 'warn';

    }else if(score <= 69){

        type = '云主机/托管服务器';
        level = '⚠️ 较高风险';
        badgeClass = 'warn';

    }else{

        type = '代理/VPN高概率';
        level = '❌ 高风险';
        badgeClass = 'danger';
    }

    if(reasons.length === 0){

        reasons.push(
        '未命中已知云厂商或托管服务商规则，推测为普通互联网接入网络。'
        );
    }

    return {
        score,
        type,
        level,
        badgeClass,
        reasons
    };
}

async function load(targetIP=''){

    try{

        const url = targetIP
            ? `https://ip.fs.kg/${targetIP}/json`
            : 'https://ip.fs.kg/json';

        const data = await fetch(url)
            .then(r=>r.json());

        currentIP = data.ip;

        const risk =
            calculateRisk(data);

        document.getElementById('ip')
            .textContent=data.ip || '-';

        document.getElementById('location')
            .textContent=
            `${data.city || '-'} · ${data.region || '-'} · ${data.country || '-'}`;

        document.getElementById('asn')
            .textContent=
            data.asn
            ? `AS${data.asn}`
            : '-';

        document.getElementById('tls')
            .textContent=
            data.tlsVersion || '-';

        document.getElementById('colo')
            .textContent=
            data.colo || '-';

        document.getElementById('protocol')
            .textContent=
            data.httpProtocol || '-';

        document.getElementById('networkType')
            .textContent=
            risk.type;

        document.getElementById('riskScore')
            .textContent=
            risk.score;

        const badge =
            document.getElementById(
                'riskBadge'
            );

        badge.className =
            `badge ${risk.badgeClass}`;

        badge.textContent =
            risk.level;

        document.getElementById(
            'analysisText'
        ).innerHTML = `
            ${risk.reasons.join('<br>')}
        `;

        document.getElementById('loading')
            .style.display='none';

        document.getElementById('app')
            .style.display='block';

    }catch(e){

        alert(
            '查询失败：' +
            e.message
        );
    }
}

function queryIP(){

    const ip =
        document.getElementById(
            'ipInput'
        ).value.trim();

    if(!ip){
        load();
        return;
    }

    load(ip);
}

document.addEventListener(
'DOMContentLoaded',
()=>{

    document
    .getElementById('ipInput')
    .addEventListener(
        'keydown',
        e=>{

            if(e.key==='Enter'){
                queryIP();
            }
        }
    );

    load();
});

</script>

</body>
</html>
