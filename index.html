<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IP 环境分析</title>

<style>

:root{
    --bg:#f5f7fb;
    --card:#fff;
    --border:#e8edf5;
    --text:#0f172a;
    --sub:#64748b;
    --green:#16a34a;
    --greenbg:#ecfdf5;
    --red:#dc2626;
    --redbg:#fef2f2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
}

/* 顶部 */

.hero{

    padding:32px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.ip-title{
    color:var(--sub);
    font-size:14px;
}

.ip{

    font-size:42px;
    font-weight:800;

    margin-top:10px;
}

.location{
    margin-top:12px;
    color:var(--sub);
}

.score{

    text-align:right;
}

.status-circle{

    width:90px;
    height:90px;

    border-radius:50%;

    border:3px solid #9ae6b4;

    color:var(--green);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:18px;
    font-weight:700;

    margin-left:auto;
}

.score-value{

    font-size:18px;

    margin-top:10px;
}

.bar{

    height:8px;
    border-radius:999px;

    background:#edf2f7;

    margin-top:10px;
}

.bar-fill{

    height:100%;
    width:0%;

    background:#22c55e;

    border-radius:999px;
}

/* 类型 */

.type-card{

    padding:28px;

    margin-bottom:20px;

    display:flex;
    gap:16px;
    align-items:center;
}

.icon{

    width:60px;
    height:60px;

    border-radius:14px;

    background:#ecfdf5;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
}

.type-title{

    font-size:24px;
    font-weight:700;
}

.badge{

    display:inline-block;

    background:#ecfdf5;

    color:#16a34a;

    padding:3px 10px;

    border-radius:999px;

    font-size:12px;
}

.type-desc{

    margin-top:6px;
    color:var(--sub);
}

/* 详情 */

.section{

    padding:24px;
}

.section-title{
    font-size:18px;
    margin-bottom:20px;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:16px;
}

.info{

    background:#fafbfd;

    border:1px solid #eff2f6;

    border-radius:16px;

    padding:20px;
}

.info-label{

    color:var(--sub);
    font-size:13px;

    margin-bottom:10px;
}

.info-value{

    font-size:22px;
    font-weight:700;
}

/* 风险 */

.risk{

    margin-top:20px;

    padding:24px;
}

.risk.safe{
    background:var(--greenbg);
    border:1px solid #a7f3d0;
}

.risk.danger{
    background:var(--redbg);
    border:1px solid #fecaca;
}

.risk-title{

    font-size:20px;
    font-weight:700;
}

.risk-desc{

    margin-top:10px;

    color:var(--sub);
}

.loading{

    text-align:center;
    margin-top:120px;

    color:var(--sub);
}

</style>
</head>
<body>

<div class="container">

<div id="loading" class="loading">
正在检测网络环境...
</div>

<div id="app" style="display:none;">

<div class="card hero">

    <div>

        <div class="ip-title">
            IP 地址
        </div>

        <div id="ip" class="ip"></div>

        <div id="location" class="location"></div>

    </div>

    <div class="score">

        <div id="statusCircle"
        class="status-circle">
            安全
        </div>

        <div id="scoreText"
        class="score-value">
            0/100
        </div>

        <div class="bar">
            <div id="scoreBar"
            class="bar-fill"></div>
        </div>

    </div>

</div>

<div class="card type-card">

    <div id="typeIcon"
    class="icon">
        🏠
    </div>

    <div>

        <div>
            <span id="ipType"
            class="type-title">
                家庭宽带
            </span>

            <span class="badge">
                低风险
            </span>
        </div>

        <div id="ipTypeDesc"
        class="type-desc">
        </div>

    </div>

</div>

<div class="card section">

<h2 class="section-title">
详细信息
</h2>

<div class="grid" id="grid"></div>

</div>

<div id="riskBox"
class="risk safe">

    <div class="risk-title">
        ✅ 未检测到明显风险
    </div>

    <div id="riskDesc"
    class="risk-desc"></div>

</div>

</div>

</div>

<script>

function item(title,value){

return `
<div class="info">
    <div class="info-label">${title}</div>
    <div class="info-value">${value||'-'}</div>
</div>
`;

}

load();

async function load(){

try{

const res =
await fetch("https://api.ipapi.is/");

const data =
await res.json();

let score = 0;

if(data.is_datacenter) score += 50;
if(data.is_vpn) score += 20;
if(data.is_proxy) score += 20;
if(data.is_tor) score += 30;
if(data.is_abuser) score += 30;

let type = "家庭宽带";
let desc =
"住宅IP，来自常规互联网服务提供商";

if(data.is_datacenter){

type = "数据中心";
desc =
"检测到机房或云服务提供商网络";

}

if(data.is_vpn){

type = "VPN 网络";
desc =
"检测到 VPN 服务";

}

if(data.is_proxy){

type = "代理网络";
desc =
"检测到代理服务";

}

document.getElementById("ip")
.innerText =
data.ip;

document.getElementById("location")
.innerText =
`${data.city || '-'} · ${data.region || '-'} · ${data.country || '-'}`;

document.getElementById("scoreText")
.innerText =
`${score}/100`;

document.getElementById("scoreBar")
.style.width =
score + "%";

document.getElementById("ipType")
.innerText = type;

document.getElementById("ipTypeDesc")
.innerText = desc;

document.getElementById("grid")
.innerHTML =

item(
"地理位置",
`${data.country}
 ${data.city || ''}`
)+

item(
"运营商 / ASN",
data.asn
? `AS${data.asn}`
: data.asn_org || '-'
)+

item(
"时区",
data.timezone
)+

item(
"坐标位置",
`${data.lat},
 ${data.lon}`
);

const riskBox =
document.getElementById("riskBox");

const riskDesc =
document.getElementById("riskDesc");

if(score===0){

riskDesc.innerText=
"来自普通 ISP 网络，未发现 VPN、代理、Tor 或数据中心特征。";

}else{

riskBox.className=
"risk danger";

riskBox.querySelector(
".risk-title"
).innerText=
"⚠️ 检测到潜在风险";

riskDesc.innerText=
`VPN:${data.is_vpn}
  Proxy:${data.is_proxy}
  Tor:${data.is_tor}
  Datacenter:${data.is_datacenter}`;

}

document.getElementById("loading")
.style.display="none";

document.getElementById("app")
.style.display="block";

}catch(error){

document.getElementById("loading")
.innerHTML =
error.message;

}

}

</script>

</body>
</html>
