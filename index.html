<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>IP 环境分析</title>

<style>

body{
background:#f6f8fb;
font-family:
Inter,
system-ui;
margin:0;
padding:40px 20px;
color:#111827;
}

.container{
max-width:1100px;
margin:auto;
}

.hero{
background:#fff;
border:1px solid #eaeef5;
border-radius:24px;
padding:40px;
margin-bottom:20px;
}

.ip{
font-size:52px;
font-weight:800;
}

.location{
margin-top:12px;
color:#6b7280;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#fff;
border:1px solid #eaeef5;
padding:20px;
border-radius:18px;
}

.label{
font-size:12px;
color:#6b7280;
margin-bottom:8px;
}

.value{
font-size:22px;
font-weight:700;
}

.tag{
display:inline-block;
padding:6px 12px;
border-radius:999px;
margin-top:16px;
background:#ecfdf5;
color:#15803d;
}

.score{
margin-top:10px;
font-size:20px;
font-weight:700;
}

.progress{
height:8px;
background:#edf2f7;
border-radius:999px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0;
background:#22c55e;
}

</style>
</head>

<body>

<div class="container">

<div class="hero">

<div id="ip" class="ip">
Loading...
</div>

<div id="location"
class="location">
-
</div>

<div id="type"
class="tag">
检测中
</div>

<div id="risk"
class="score">
风险评分 0/100
</div>

<div class="progress">
<div id="bar"
class="progress-bar">
</div>
</div>

</div>

<div class="grid">

<div class="card">
<div class="label">
住宅置信度
</div>
<div id="residential"
class="value">
-
</div>
</div>

<div class="card">
<div class="label">
数据中心概率
</div>
<div id="datacenter"
class="value">
-
</div>
</div>

<div class="card">
<div class="label">
VPN
</div>
<div id="vpn"
class="value">
-
</div>
</div>

<div class="card">
<div class="label">
Proxy
</div>
<div id="proxy"
class="value">
-
</div>
</div>

<div class="card">
<div class="label">
Tor
</div>
<div id="tor"
class="value">
-
</div>
</div>

<div class="card">
<div class="label">
ASN
</div>
<div id="asn"
class="value">
-
</div>
</div>

</div>

</div>

<script>

async function load(){

const data =
await fetch("/api/ip")
.then(r=>r.json());

document.getElementById("ip")
.textContent = data.ip;

document.getElementById("location")
.textContent =
`${data.city || '-'} ·
${data.country || '-'}`;

document.getElementById("type")
.textContent =
data.analysis.type;

document.getElementById("risk")
.textContent =
`风险评分 ${data.analysis.riskScore}/100`;

document.getElementById("bar")
.style.width =
data.analysis.riskScore + "%";

document.getElementById("residential")
.textContent =
data.analysis.residentialScore + "%";

document.getElementById("datacenter")
.textContent =
data.analysis.datacenterScore + "%";

document.getElementById("vpn")
.textContent =
data.analysis.vpnScore + "%";

document.getElementById("proxy")
.textContent =
data.analysis.proxyScore + "%";

document.getElementById("tor")
.textContent =
data.analysis.torScore + "%";

document.getElementById("asn")
.textContent =
"AS" + (data.asn || "-");

}

load();

</script>

</body>
</html>
